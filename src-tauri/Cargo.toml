[package]
name = "pascoal"
version = "2026.3.0"
description = "A modern Pascal playground and IDE"
authors = ["Brener Fregulia"]
license = "MIT"
repository = "https://github.com/brener-fregulia/Pascoal"
edition = "2021"
rust-version = "1.85.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
portable-pty = "0.9.0"
tree-sitter = "0.25"
tree-sitter-pascal = "0.10.2"
tree-sitter-highlight = "0.25"
tauri-plugin-wdio-webdriver = { version = "1", optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros"] }

# Only present in builds explicitly compiled with --features e2e (see the
# `e2e` npm script). This starts a WebDriver control server inside the app
# for WebdriverIO's Tauri service - it must never ship in a real release
# build, which is exactly what making it optional + feature-gated ensures:
# `cargo tauri build` (used by release.yml) never enables it.
[features]
e2e = ["dep:tauri-plugin-wdio-webdriver"]

[[test]]
name = "pascal_runner"
path = "tests/pascal_runner.rs"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

[target.'cfg(any(windows, target_os = "linux"))'.dependencies]
tauri-plugin-window-state = "2.4.1"
